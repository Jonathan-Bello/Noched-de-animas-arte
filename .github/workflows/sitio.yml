# Compila el sitio Astro (sitio/) y lo publica en GitHub Pages.
# No descarga Git LFS: el sitio usa solo miniaturas guardadas fuera de LFS.
name: Sitio

on:
  push:
    branches: [main]
    paths: ["sitio/**", "web/**", "iconos/**", "catalogo/**", "fabrica/catalogo_juego.json", "*.html", "archivo.*", ".github/workflows/sitio.yml"]
  pull_request:
    paths: ["sitio/**", "web/**", "iconos/**", "catalogo/**", "fabrica/catalogo_juego.json", "*.html", "archivo.*", ".github/workflows/sitio.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sitio
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio/dist

  publicar:
    # Requiere Settings → Pages → Source: «GitHub Actions», y la variable de repositorio SITIO_ASTRO=true.
    if: github.event_name != 'pull_request' && vars.SITIO_ASTRO == 'true'
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
